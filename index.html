<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT-like Interface</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="main-content">
    <div class="chat-panel" id="chat-panel"></div>
    <div class="input-container">
      <textarea id="user-input" placeholder="Message ChatGPT"></textarea>
      <button id="send-button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4 L12 20 M6 10 L12 4 L18 10" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
      </button>
    </div>
  </div>
  
  <!-- Toggle Button to Hide/Show Panel -->
  <div class="toggle-panel-button" id="togglePanelButton">></div>

  <div class="pii-notice-panel" id="piiNoticePanel">
    <div class="pii-panel-header">
      <h2>Notice</h2>
    </div>
    <div class="pii-panel-content">
      <p>This panel will show sensitive information if detected in your message.</p>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
