<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to the Chatbot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* A neutral gradient background and center content */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f7f7f7, #eaeaea);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      padding: 20px;
    }

    /* Container styles*/
    .container {
      background: #fff;
      width: 100%;
      max-width: 600px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      padding: 40px 50px;
    }

    /* Header styling */
    h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 700;
      color: #333;
    }

    /* Form group styling */
    .form-group, .radio-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      color: #555;
    }

    /* Input styling */
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 5px;
      transition: border 0.3s ease;
    }
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #666;
      outline: none;
    }

    input::placeholder {
        color: #aaa; 
    }

    /* Radio button group styling */
    .radio-group p {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #555;
    }
    .radio-option {
      margin-right: 20px;
      font-size: 16px;
      display: inline-block;
      color: #555;
    }
    .radio-option input {
      margin-right: 5px;
    }

    /* Button styling */
    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      background-color: #4e4e4e;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #3a3a3a;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }
      h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome to the Chatbot!</h2>
    <div class="form-group">
      <label for="umass-email">Enter your UMass Email Address:</label>
      <input type="email" id="umass-email" placeholder="example@umass.edu">
    </div>
    <div class="form-group">
      <label for="full-name">Enter your Full Name:</label>
      <input type="text" id="full-name" placeholder="Your Full Name">
    </div>
    <div class="form-group">
      <label for="study-password">Enter Study Password:</label>
      <input type="password" id="study-password" placeholder="Study Password">
    </div>
    <div class="radio-group">
      <p>Select one of the following:</p>
      <label class="radio-option">
        <input type="radio" name="zoomMeeting" value="first">
        This is my First Zoom Meeting
      </label>
      <label class="radio-option">
        <input type="radio" name="zoomMeeting" value="second">
        This is my Second Zoom Meeting
      </label>
    </div>
    <button id="start-button">Let's Use the Chatbot</button>
  </div>

  <script>
    // The hard-coded study password
    const correctPassword = "password-6201";

    document.getElementById('start-button').addEventListener('click', function() {
      // Retrieve values from the input fields
      const email = document.getElementById('umass-email').value.trim();
      const name = document.getElementById('full-name').value.trim();
      const password = document.getElementById('study-password').value;
      const zoomMeetingOption = document.querySelector('input[name="zoomMeeting"]:checked');

      // Basic validation to ensure all fields are filled
      if (!email || !name || !password || !zoomMeetingOption) {
        alert('Please fill in all fields.');
        return;
      }

      // Validate the email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        alert('Please enter a valid email address.');
        return;
      }

      // Validate the password
      if (password !== correctPassword) {
        alert('Incorrect password. Please try again.');
        return;
      }

      // Store the data in localStorage for later use
      localStorage.setItem('umassEmail', email);
      localStorage.setItem('fullName', name);
      localStorage.setItem('zoomMeeting', zoomMeetingOption.value);

      // Redirect to the main chatbot interface page
      window.location.href = 'chatbot.html';
    });
  </script>
</body>
</html>
